# One agent per Compose project. Run once per agent:
#   docker compose -p buzz-agent-<name> -f compose.agents.yml --env-file <outdir>/<name>.compose.env up -d
# The env file supplies the variables below. Each project gets its own network and
# its own home volume, so agents cannot reach each other or the relay's databases.
services:
  agent:
    image: ${AGENTS_IMAGE:?AGENTS_IMAGE is required}
    env_file: ${AGENT_ENV_FILE:?AGENT_ENV_FILE is required}
    labels:
      buzz.agent: ${AGENT_NAME:?AGENT_NAME is required}
    # A clean exit means the owner sent !shutdown, so only restart on failure.
    restart: on-failure
    stop_grace_period: 60s
    # The relay derives the community from the Host header, so agents use the
    # public name, which resolves to the host's Caddy on port 443.
    extra_hosts:
      - "${BUZZ_DOMAIN:?BUZZ_DOMAIN is required}:host-gateway"
    # No working_dir: the MCP config is found from the image WORKDIR, /home/agent.
    volumes:
      - home:/home/agent
      # The container user is uid 1001 and the mount is read-only, so the staged
      # directory must be mode 0755 and its mcp.json mode 0644.
      - ${AGENT_CONFIG_DIR:?AGENT_CONFIG_DIR is required}:/etc/buzz-agent:ro

volumes:
  home:
