[package]
name = "buzz-hive-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP routes and token auth for the Beehive workflow engine"

[dependencies]
buzz-hive-core = { path = "../buzz-hive-core" }
buzz-auth = { workspace = true }
async-trait = "0.1"
pbjson = "0.9"
pbjson-types = "0.9"
prost = "0.14"
prost-types = "0.14"
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
pbjson-build = "0.9"
prost-build = "0.14"
# Build machines and the Docker image need no system protoc.
protoc-bin-vendored = "3"

[dev-dependencies]
buzz-hive-core = { path = "../buzz-hive-core", features = ["testing"] }
tower = { workspace = true }
hex = { workspace = true }
