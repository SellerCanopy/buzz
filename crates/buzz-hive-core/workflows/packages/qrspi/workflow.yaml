version: 2
stages:
  - id: questions
    pause: true
    name: Questions
    kind: prompt
    command: 01-create-research-questions
    args: "GH-{{issue.number}}: {{issue.title}}\n\n{{issue.body}}"
    agent: builder
    outputs:
      - artifact: questions
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-01-questions.md"
    execution: { timeout: 30m }
  - id: research
    name: Research
    kind: prompt
    command: 02-create-research
    args: "{{artifacts.questions.file}}"
    agent: builder
    outputs:
      - artifact: research
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-02-research.md"
    execution: { timeout: 45m }
  - id: design
    name: Design discussion
    kind: prompt
    command: 03-create-design-discussion
    args: "{{artifacts.research.file}}"
    agent: builder
    outputs:
      - artifact: design
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-03-design.md"
    execution: { timeout: 30m }
  - id: design_review
    name: Design review
    kind: approval
    approval: { artifacts: [design] }
    on: { needs_work: design }
    loop_limit: 5
  - id: requirements
    name: Requirements
    kind: prompt
    command: 03-create-prd
    args: "{{artifacts.design.file}}"
    agent: builder
    outputs:
      - artifact: requirements
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-03-requirements.md"
    execution: { timeout: 1h }
  - id: requirements_review
    name: Requirements review
    kind: approval
    approval: { artifacts: [requirements] }
    on: { needs_work: requirements }
    loop_limit: 5
  - id: tdd
    name: Technical design
    kind: prompt
    command: 03-create-tdd
    args: "{{artifacts.design.file}}"
    agent: builder
    outputs:
      - artifact: tdd
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-03-tdd.md"
    execution: { timeout: 1h }
  - id: tdd_review
    name: Technical design review
    kind: approval
    approval: { artifacts: [tdd] }
    on: { needs_work: tdd }
    loop_limit: 5
  - id: outline
    name: Outline
    kind: prompt
    command: 04-create-structure-outline
    args: "{{artifacts.design.file}}"
    agent: builder
    outputs:
      - artifact: outline
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-04-decompose.md"
    execution: { timeout: 30m }
  - id: outline_review
    name: Outline review
    kind: approval
    approval: { artifacts: [outline] }
    on: { needs_work: outline }
    loop_limit: 5
  - id: plan
    name: Plan
    kind: prompt
    command: 05-create-plan
    args: "{{artifacts.outline.file}}"
    agent: builder
    outputs:
      - artifact: plan
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-05-plan.md"
    execution: { timeout: 30m }
  - id: plan_review
    name: Plan review
    kind: approval
    approval: { artifacts: [plan] }
    on: { needs_work: plan }
    loop_limit: 5
  - id: implement
    name: Implement
    kind: prompt
    command: 06-implement-plan
    inputs:
      - { name: plan, required: true }
    args: "{{inputs.plan.file}}"
    agent: builder
    execution: { timeout: 4h }
  - id: code_review
    name: Code review
    kind: prompt
    command: 07-code-review
    args: ".claude/tasks/GH-{{issue.number}}-*"
    agent: builder
    outputs:
      - artifact: review
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-07-qa-plan.md"
        optional: true # a clean review writes no fix plan
    on:
      passed: describe_pr
      needs_work: { to: implement, give: { plan: review }, then: describe_pr }
    loop_limit: 3
    execution: { timeout: 30m }
  - id: describe_pr
    name: Describe pull request
    kind: prompt
    command: 06-describe-pr
    args: ".claude/tasks/GH-{{issue.number}}-*"
    agent: builder
    outputs:
      - artifact: pr_body
        file: ".claude/tasks/GH-{{issue.number}}-*/GH-{{issue.number}}-08-pr-body.md"
    execution: { timeout: 15m }
  - id: pull_request
    name: Pull request
    kind: action
    action: open_pull_request
    with: { body_artifact: pr_body, draft: "true" }
  - id: validate
    name: Validate
    kind: action
    action: wait_for_ci
    on: { passed: mark_ready, failed: fix_ci }
  - id: fix_ci
    name: Fix CI failures
    kind: prompt
    command: 06-fix-ci
    args: "{{artifacts.ci-failure.path}}"
    agent: builder
    on: { passed: pull_request }
    loop_limit: 3
    execution: { timeout: 2h }
  - id: mark_ready
    name: Mark ready for review
    kind: action
    action: mark_ready
  - id: cleanup
    pause: true
    name: Cleanup
    kind: action
    action: cleanup_worktree
