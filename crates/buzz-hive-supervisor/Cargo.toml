[package]
name = "buzz-hive-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host service that applies each agent's tool servers and Beehive settings"

[lib]
name = "buzz_hive_supervisor"
path = "src/lib.rs"

[[bin]]
name = "buzz-hive-supervisor"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
buzz-hive-core = { path = "../buzz-hive-core" }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
buzz-hive-core = { path = "../buzz-hive-core", features = ["testing"] }
tempfile = "3"
