[package]
name = "buzz-hive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Beehive workflow engine service"

[lib]
name = "buzz_hive"
path = "src/lib.rs"

[[bin]]
name = "buzz-hive"
path = "src/main.rs"

[dependencies]
buzz-hive-api = { path = "../buzz-hive-api" }
buzz-hive-core = { path = "../buzz-hive-core" }
buzz-hive-store = { path = "../buzz-hive-store" }
buzz-sdk = { workspace = true }
buzz-ws-client = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
chrono = { workspace = true }
nostr = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
buzz-hive-core = { path = "../buzz-hive-core", features = ["testing"] }
tempfile = "3"
base64 = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
